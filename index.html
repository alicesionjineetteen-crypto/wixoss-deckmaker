<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>WIXOSS Deck Builder</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>

<script src="js/card_info.js" defer></script>
<script src="main.js" defer></script>

<link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="player-info">
  ニックネーム：<span id="nickname"></span><br>
  使用ルリグ：<span id="center-lrig"></span><br>
  <button id="open-settings">設定を開く</button>
</div>

<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h3>設定</h3>

    <label>ニックネーム</label>
    <input id="nickname-input" type="text">

    <label>使用ルリグ（カード名）</label>
    <input id="lrig-input" type="text">

    <label>セレクターID</label>
    <input id="selector-id-input" type="text">

    <button id="save-settings">保存</button>
    <button id="close-settings">閉じる</button>
  </div>
</div>

<div id="deck-manager-modal" class="modal">
  <div class="modal-content">
    <h3>デッキの保存・呼び出し</h3>

    <input id="deck-save-name" type="text" placeholder="デッキ名を入力">
    <button id="deck-save-confirm">この内容で保存</button>

    <hr>

    <ul id="deck-list"></ul>

    <hr>

    <p class="modal-note">保存データはこの端末のブラウザ内にのみ保存されます。キャッシュ削除で消える場合があるため、バックアップをおすすめします。</p>

    <button id="export-deck-data-btn">📤 保存データをエクスポート</button>
    <label for="import-deck-data-input" class="file-label">📥 保存データをインポート</label>
    <input id="import-deck-data-input" type="file" accept="application/json" style="display:none">

    <hr>

    <button id="close-deck-manager">閉じる</button>
  </div>
</div>

<div id="text-output-modal" class="modal">
  <div class="modal-content">
    <h3>デッキリスト（テキスト）</h3>

    <textarea id="text-output-area" rows="14" readonly></textarea>

    <button id="copy-text-output">コピー</button>
    <button id="close-text-output">閉じる</button>
  </div>
</div>

<div id="export-modal" class="modal">
  <div class="modal-content">
    <h3>Excel出力</h3>

    <button id="export-excel-team-btn">チーム戦用シートで出力</button>
    <button id="export-excel-solo-btn">個人戦用シートで出力</button>

    <hr>

    <button id="close-export-modal">閉じる</button>
  </div>
</div>

<div id="stats-modal" class="modal">
  <div class="modal-content stats-content">
    <h3>デッキ内カード分布（メインデッキ）</h3>
    <div id="stats-container"></div>
    <button id="close-stats">閉じる</button>
  </div>
</div>
  
<div id="card-preview-modal" class="modal">
  <div class="modal-content preview-content">
    <img id="card-preview-img" src="" alt="カード拡大画像">
    <button id="close-card-preview">閉じる</button>
  </div>
</div>

<div id="search-area">
  <input id="search-box" type="text" placeholder="カード名 / No / テキスト検索">

  <button id="toggle-advanced-search">詳細検索 ▼</button>

   <div id="advanced-search-panel" style="display:none;">
    <label>カード名（部分一致）</label>
    <input id="filter-name" type="text" placeholder="例: エターナル">

    <label>タイプ</label>
    <select id="filter-type">
      <option value="">指定なし</option>
      <option value="ルリグ">ルリグ</option>
      <option value="アシストルリグ">アシストルリグ</option>
      <option value="シグニ">シグニ</option>
      <option value="アーツ">アーツ</option>
      <option value="スペル">スペル</option>
      <option value="ピース">ピース</option>
    </select>

    <label>レベル</label>
    <select id="filter-level">
      <option value="">指定なし</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>

    <label>色</label>
    <select id="filter-color">
      <option value="">指定なし</option>
      <option value="白">白</option>
      <option value="青">青</option>
      <option value="赤">赤</option>
      <option value="黒">黒</option>
      <option value="緑">緑</option>
      <option value="無">無</option>
    </select>

    <label>クラス（部分一致）</label>
    <input id="filter-class" type="text" placeholder="例: 精霊">

    <label>タイミング</label>
    <select id="filter-timing">
      <option value="">指定なし</option>
      <option value="メインフェイズ">メインフェイズ</option>
      <option value="アタックフェイズ">アタックフェイズ</option>
      <option value="スペルカットイン">スペルカットイン</option>
    </select>

    <label>ライフバースト</label>
    <select id="filter-burst">
      <option value="">指定なし</option>
      <option value="yes">有</option>
      <option value="no">無</option>
    </select>

    <label>テキスト（部分一致）</label>
    <input id="filter-text" type="text" placeholder="例: ドロー">

    <button id="clear-advanced-search">条件をクリア</button>
  </div>
</div>

<div id="card-list" class="card-grid"></div>

<hr>

<h2>◆ ルリグデッキ<span id="lrig-count-label" class="count-label"></span></h2>
<div id="lrig-deck" class="lrig-grid"></div>

<h2>◆ メインデッキ（ライフバースト有）<span id="burst-count-label" class="count-label"></span></h2>
<div id="main-burst" class="deck-grid"></div>

<h2>◆ メインデッキ（ライフバースト無）<span id="noburst-count-label" class="count-label"></span></h2>
<div id="main-noburst" class="deck-grid"></div>

<button id="save-btn" class="fab">💾</button>
<button id="clear-deck-btn" class="clear-btn">🗑 空にする</button>
<button id="stats-btn" class="export">📊</button>
<button id="export-btn" class="export">📄</button>
<button id="open-export-modal" class="export">🖨</button>

</body>
</html>
